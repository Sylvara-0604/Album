# 工作区唯一版本目录（single source of truth for versions）
#
# 谁在用：album / c001apk-KMP-main / searchbar / photowidget
# 怎么接：各工程 `settings.gradle.kts` 里
#     dependencyResolutionManagement {
#         versionCatalogs { create("libs") { from(files("<相对路径>/shared/gradle/libs.versions.toml")) } }
#     }
# 并删掉工程自带的 `gradle/libs.versions.toml`。
#
# 为什么放工作区级：4 个 App 共用同一套 AGP / Kotlin / Compose BOM / SDK 基线。以前每工程一份，
# 结果 c001apk 的 compileSdkMinor 落后一档、searchbar/photowidget 停在 compose-bom 2026.09.00
# 而另外两个已经是 2026.10.00。现在要改版本 → 只改这里 → `python shared\run.py version_lock` 核对。
#
# 口径（2026-10-24 用户令）：官方 androidx / compose 的 alpha、beta 主动跟；第三方库只用 stable。
# 升级流程：改这里 → 4 个工程各编译一次 → 跑 album 单测/lint → 更新 STATUS。

[versions]
# ---- 工具链 ----
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
buildconfig = "6.1.2"
# ---- 构建基线（SDK / JDK，被 4 个工程共用）----
compileSdk = "37"
compileSdkMinor = "2"
minSdk = "33"
targetSdk = "37"
jdkMajor = "27"
# ---- Compose（同版 BOM 联动：五个坐标一起动，别单独改某一个）----
composeBom = "2026.10.00"
# ---- AndroidX ----
activityCompose = "1.13.0"
activityKtx = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
serialization = "1.11.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
exifinterface = "1.4.2"
paging = "3.5.3"
media3 = "1.11.1"
room = "2.8.5"
dataStore = "1.2.1"
annotation = "1.11.0"
collectionKtx = "1.6.0"
tracing = "2.0.0"
glance = "1.2.0"
profileinstaller = "1.4.1"
metrics = "1.0.0"
# ---- 第三方 / Kotlin 生态 ----
coroutines = "1.11.0"
atomicfu = "0.33.0"
ktor = "3.6.0"
koin = "4.2.2"
koinCompiler = "1.2.1"
decompose = "3.5.0"
essenty = "2.6.0"
coil = "3.6.3"
zoomable = "0.19.0"
sonner = "0.4.0"
htmlconverter = "1.1.1"
jsoup = "1.23.2"
jbcrypt = "0.4"
# ---- View 体系（searchbar / photowidget 的老 UI 仍需要）----
materialView = "1.14.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
fragment = "1.9.1"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
# ---- 测试 / 基准 ----
junit = "4.13.2"
robolectric = "4.17"
testCore = "1.7.0"
testExtJunit = "1.3.0"
testRunner = "1.7.0"
testUiautomator = "2.4.0"
baselineprofile = "1.5.0"
benchmark = "1.5.0"

[libraries]
# ---- Compose（版本来自 BOM，不在这里写死）----
androidx-compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
