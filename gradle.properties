# ---- Gradle 运行环境 ----
# 用户对后台 JVM 很敏感：不并行过多、不用 Kotlin daemon、闲置 10 分钟退出。
# 收尾仍要 `gradle --stop` 并核对没有残留 java 进程。
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=false
org.gradle.daemon.idletimeout=600000
kotlin.compiler.execution.strategy=in-process

kotlin.code.style=official

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ---- 版本号（可用 -Palbum.versionCode=n / -Palbum.versionName=x 覆盖）----
album.versionName=0.5.19
album.versionCode=48

# declared JDK requirement (checked by shared/bin/version_lock.py; run: python shared
un.py doctor)
dsh.jdk.major=27
